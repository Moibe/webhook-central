# Configuración de despliegue para inventario-ti
APP_STACK="svelte"
PROJECT_ROOT="/home/mbriseno/code/inventario-ti"
PROJECT_BRANCH="main"
PM2_NAME="inventario-ti"

# Inventario de equipos de TI (para James). SvelteKit 3 + adapter-node + Drizzle
# (SQLite en ./local.db, ignorado por git, así que sobrevive a los pulls).
# Mismo patrón que shape_up: adapter-node NO autocarga el .env, por eso va
# --node-args="--env-file=.env". Primer arranque manual, una sola vez:
#   cd /home/mbriseno/code/inventario-ti
#   # .env: PORT=1979, HOST=0.0.0.0, ORIGIN=http://172.10.30.15:1979, DATABASE_URL=./local.db
#   npm ci && npm run build && npm run db:migrate
#   pm2 start build/index.js --name inventario-ti --cwd /home/mbriseno/code/inventario-ti --node-args="--env-file=.env"
#   pm2 save
PM2_START_CMD='pm2 start build/index.js --name inventario-ti --cwd /home/mbriseno/code/inventario-ti --node-args="--env-file=.env"'

# deploy.sh no corre migraciones por sí solo; esta app SÍ las necesita (Drizzle).
POST_BUILD="npm run db:migrate"
