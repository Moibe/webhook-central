# Configuración de despliegue para rad_view (entorno dev)
APP_STACK="svelte"
PROJECT_ROOT="/home/mbriseno/code/rad_view-dev"
PROJECT_BRANCH="dev"
PM2_NAME="rad-view-dev"

# RAD View: panel de administración de RAD (document_ai): API keys de sus clientes
# y uso. App nueva de CSI → arranca SOLO en DEV (rama dev, pestaña Dev de la UI),
# como inventario-ti; sin prod ni botón de promover todavía. Puerto 4901 (el 4902
# queda apartado para su prod).
#
# SvelteKit 2 + adapter-node 5 + better-sqlite3 12 a propósito (Node 20.20.2 aquí).
# adapter-node NO autocarga el .env, por eso --node-args="--env-file=.env".
# Primer arranque manual, una sola vez:
#   git clone -b dev https://github.com/Moibe/rad_view.git /home/mbriseno/code/rad_view-dev
#   cd /home/mbriseno/code/rad_view-dev
#   # .env: DATABASE_URL=./local.db, PORT=4901, HOST=0.0.0.0, ORIGIN=http://172.10.30.15:4901
#   #       (http:// → la cookie de sesión no va Secure; con Secure el login rebota),
#   #       ADMIN_USER/ADMIN_PASSWORD (cuenta inicial), RAD_URL=http://127.0.0.1:8102 y
#   #       RAD_ADMIN_TOKEN = el mismo valor que en el .env de document_ai-dev.
#   npm ci && npm run build && npm run db:migrate && npm run db:seed:admin
#   pm2 start build/index.js --name rad-view-dev --cwd /home/mbriseno/code/rad_view-dev --node-args="--env-file=.env"
#   pm2 save
PM2_START_CMD='pm2 start build/index.js --name rad-view-dev --cwd /home/mbriseno/code/rad_view-dev --node-args="--env-file=.env"'

# deploy.sh no corre migraciones por sí solo (Drizzle). El seed es idempotente: solo
# crea la cuenta admin si no hay ninguna. Si algo falla, deploy.sh aborta antes del
# pm2 restart y sigue corriendo la versión anterior.
POST_BUILD="npm run db:migrate && npm run db:seed:admin"
