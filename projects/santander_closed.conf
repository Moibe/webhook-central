# Configuración de despliegue para santander_closed (prod)
# Extracción local de INE sin Document AI. Hoy /ine extrae solo la MRZ (el anverso está pendiente).
APP_STACK="python"
PROJECT_ROOT="/home/mbriseno/code/santander_closed"
PROJECT_BRANCH="main"
VENV_PATH="$PROJECT_ROOT/venv"
PM2_NAME="santander_closed"
PM2_START_CMD='pm2 start /home/mbriseno/code/santander_closed/venv/bin/python --name santander_closed --interpreter none --cwd /home/mbriseno/code/santander_closed -- -m gunicorn app:app --workers 2 --worker-class uvicorn.workers.UvicornWorker --bind 0.0.0.0:8102'

# Primer arranque, a mano y una sola vez (deploy.sh necesita el checkout ya hecho):
#   git clone git@github.com:Moibe/santander_closed.git /home/mbriseno/code/santander_closed
#   cd /home/mbriseno/code/santander_closed && python3 -m venv venv && venv/bin/pip install -r requirements.txt
#   (el PM2_START_CMD de arriba) && pm2 save
# No necesita credenciales ni .env: no llama a la nube. El modelo de la MRZ viene en el repo (modelos/).

# Usadas por promote.sh (botón de merge dev -> main en la UI).
GITHUB_REPO="Moibe/santander_closed"
MERGE_HEAD="dev"
MERGE_BASE="main"
