# Configuración de despliegue para santander_ia (entorno dev)
# Hermano de santander_ia.conf (prod): mismo repo, checkout y rama distintos.
APP_STACK="python"
PROJECT_ROOT="/home/mbriseno/code/santander_ia-dev"
PROJECT_BRANCH="dev"
VENV_PATH="$PROJECT_ROOT/venv"
PM2_NAME="santander_ia_dev"

# Igual que prod, la app NO arranca sin dos archivos que git no trae:
# documentai_sa.json (service account de GCP) y .env con la ruta ABSOLUTA a
# esa copia. Van a mano, una sola vez — ver DEPLOY.md de santander_ia.
# Primer arranque manual (pm2 no lee el .env solo; sin el `set -a` la app
# queda sin GOOGLE_APPLICATION_CREDENTIALS y /ine responde 503):
#   cd /home/mbriseno/code/santander_ia-dev
#   set -a && . ./.env && set +a
#   pm2 start venv/bin/python --name santander_ia_dev --interpreter none \
#     -- -m gunicorn app:app --workers 4 \
#        --worker-class uvicorn.workers.UvicornWorker --bind 0.0.0.0:8101
#   pm2 save
PM2_START_CMD='pm2 start /home/mbriseno/code/santander_ia-dev/venv/bin/python --name santander_ia_dev --interpreter none --cwd /home/mbriseno/code/santander_ia-dev -- -m gunicorn app:app --workers 4 --worker-class uvicorn.workers.UvicornWorker --bind 0.0.0.0:8101'

# Dev y prod pegan a los MISMOS processors de Document AI (decisión explícita,
# 2026-09-22): comparten proyecto de GCP y por lo tanto cuota. Si algún día se
# quieren separar, hay que parametrizar PROJECT_ID / CLASIFICADOR_ID / el
# endpoint del processor, que hoy están hardcodeados en clasificador.py y
# funciones.py.
