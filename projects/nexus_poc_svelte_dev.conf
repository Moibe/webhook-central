# Configuración de despliegue para nexus_poc_svelte (entorno dev)
# Hermano de nexus_poc_svelte.conf (prod): mismo repo, checkout y rama distintos.
APP_STACK="svelte"
PROJECT_ROOT="/home/mbriseno/code/nexus_poc_svelte-dev"
PROJECT_BRANCH="dev"
PM2_NAME="nexus-front-dev"

PM2_START_CMD='pm2 start build/index.js --name nexus-front-dev --cwd /home/mbriseno/code/nexus_poc_svelte-dev --node-args="--env-file=.env"'

# ── Qué va en el .env de ESTE checkout (a mano, git no lo trae) ──────────────
#
# NEXUS_API_URL=http://127.0.0.1:8084   ← LA LÍNEA MÁS IMPORTANTE DEL ARCHIVO.
#   Si falta, el front NO truena: cae a su default http://127.0.0.1:8083, que
#   es el back de PRODUCCIÓN. Quedaría un "ambiente dev" mandando documentos a
#   los datos reales, y nada en la pantalla lo delataría. Esta es la línea que
#   separa dev de prod en esta app.
#
# PORT=3401
# HOST=0.0.0.0        ← sin nginx delante, como el resto de esta máquina.
#
# ORIGIN=http://172.10.30.15:3401   ← cadena EXACTA, y con el puerto de dev.
#   SvelteKit la compara contra el header Origin de todo POST con formulario;
#   si no coincide responde 403 "Cross-site POST form submissions are
#   forbidden". Ojo con cómo se ve la falla: los GET siguen dando 200, así que
#   la app parece sana hasta que procesas un documento. Ya costó caro en prod
#   el 2026-09-10 (ver nexus_poc_svelte.conf y el .env.example del repo).
#
# BODY_SIZE_LIMIT=25M  ← obligatoria, igual que en prod. adapter-node topa el
#   cuerpo en 512 KB por default y una foto de INE pesa 1.5-3 MB. Falla feo:
#   Node aborta el stream antes del handler, así que el error no habla de
#   tamaño. Y no se reproduce en `npm run dev`.
#
# NEXUS_API_KEY        ← la MISMA que el .env del back dev (8084), no la de prod.
# NEXUS_TENANT         ← el mismo tenant con el que opera el front de prod.
#
# Nada de esto lo ve el navegador: el front es un BFF y reenvía desde su capa
# server. Por eso la llave puede vivir aquí sin exponerse.
