# Configuración de despliegue para nexus_back (entorno dev)
# Hermano de nexus_back.conf (prod): mismo repo, checkout y rama distintos.
APP_STACK="python"
PROJECT_ROOT="/home/mbriseno/code/nexus_back-dev"
PROJECT_BRANCH="dev"
VENV_PATH="$PROJECT_ROOT/venv"
PM2_NAME="nexus-back-api-dev"

# El puerto lo fija este comando, NO el PORT del .env (uvicorn obedece al flag
# explícito). Aun así conviene que el .env diga PORT=8084, para que no haya dos
# números distintos a la vista diciendo cosas diferentes.
PM2_START_CMD='pm2 start /home/mbriseno/code/nexus_back-dev/venv/bin/python --name nexus-back-api-dev --interpreter none --cwd /home/mbriseno/code/nexus_back-dev -- -m uvicorn app:app --host 0.0.0.0 --port 8084'

# ── Qué va en el .env de ESTE checkout (a mano, git no lo trae) ──────────────
#
# SQLSERVER_HOST=   ← VACÍO a propósito mientras no exista la base dev.
#   Es un interruptor: con la variable vacía, app.py ni registra el router
#   /documentos/*, así que esta instancia no puede tocar datos. El día que el
#   DBA entregue la base de desarrollo se llena y se reinicia; el grupo de
#   endpoints aparece solo. Lo que NO hay que hacer es apuntarlo al SQL Server
#   de producción: dev escribiría en los datos reales.
#
# ALMACEN_RUTA=     ← su propia carpeta, nunca la de prod.
#   Vacía también es un estado válido (los endpoints de archivos responden un
#   error claro). Si se llena, que apunte a una ruta exclusiva de dev.
#
# ENVIRONMENT=dev   ← solo informativo, sale en el status de la API. Ayuda a
#   saber de un vistazo a qué instancia le estás pegando.
#
# NEXUS_API_KEY     ← conviene una DISTINTA a la de prod: si se filtra la de
#   dev, no abre producción. Debe coincidir con la del front dev (3401).
#
# DOCAI_*           ← hoy serían los mismos procesadores que prod, o sea misma
#   cuota y mismo costo por llamada. Mismo criterio que se aceptó en
#   santander_ia; si algún día molesta, aquí es donde se separa.
