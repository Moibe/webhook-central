# Configuración de despliegue para notificaciones_twilio
APP_STACK="python"
PROJECT_ROOT="/home/mbriseno/code/notificaciones_twilio"
PROJECT_BRANCH="main"
VENV_PATH="$PROJECT_ROOT/venv"
PM2_NAME="notificaciones-twilio"
# Mantener en "dev" hasta nuevo aviso (etapa de pruebas con Twilio sandbox).
# Cambiar a "prod" cuando se quiera volver al runtime de producción.
APP_ENV="dev"
# --workers 1 obligatorio mientras el bus de eventos SSE viva en memoria
# (cada worker tiene su propio _subscribers set). Subir a >1 solo después de
# migrar a un broker compartido (Redis pub/sub, etc.).
PM2_START_CMD='pm2 start /home/mbriseno/code/notificaciones_twilio/venv/bin/python --name notificaciones-twilio --cwd /home/mbriseno/code/notificaciones_twilio -- -m gunicorn main:app --workers 1 --worker-class uvicorn.workers.UvicornWorker --bind 0.0.0.0:8082'
