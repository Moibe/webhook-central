# Configuración de despliegue para nexus_poc_svelte (entorno staging)
# Hermano de nexus_poc_svelte.conf (prod) y nexus_poc_svelte_dev.conf: mismo repo, checkout y rama distintos.
APP_STACK="svelte"
PROJECT_ROOT="/home/mbriseno/code/nexus_poc_svelte-staging"
PROJECT_BRANCH="staging"
PM2_NAME="nexus-front-staging"

PM2_START_CMD='pm2 start build/index.js --name nexus-front-staging --cwd /home/mbriseno/code/nexus_poc_svelte-staging --node-args="--env-file=.env"'

# Botón de promoción de la fila staging: dev -> staging (PR + merge inmediato).
GITHUB_REPO="Moibe/nexus_poc_svelte"
MERGE_HEAD="dev"
MERGE_BASE="staging"

# ── Qué va en el .env de ESTE checkout (a mano, git no lo trae) ──────────────
# NEXUS_API_URL=http://127.0.0.1:8085   ← LA LÍNEA MÁS IMPORTANTE: si falta, el
#   front cae al back de PRODUCCIÓN (8083) sin avisar.
# PORT=3402, HOST=0.0.0.0, API_BASE_URL=http://127.0.0.1:8085
# ORIGIN=http://172.10.30.15:3402  ← cadena EXACTA con el puerto de staging; si no,
#   los POST con formulario dan 403 aunque los GET den 200.
# BODY_SIZE_LIMIT=25M  ← obligatoria (fotos de INE de 1.5-3 MB).
# NEXUS_API_KEY y AUTH_JWT_SECRET: los MISMOS que el .env del back staging (8085).
