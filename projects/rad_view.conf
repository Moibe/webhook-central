# Configuración de despliegue para rad_view (entorno prod)
APP_STACK="svelte"
PROJECT_ROOT="/home/mbriseno/code/rad_view"
PROJECT_BRANCH="main"
PM2_NAME="rad-view"

# Prod de RAD View: rama main, puerto 4902. Mismo stack que dev (ver rad_view-dev.conf).
# RAD_URL apunta a document_ai prod (8099); RAD_ADMIN_TOKEN pendiente en el .env.
PM2_START_CMD='pm2 start build/index.js --name rad-view --cwd /home/mbriseno/code/rad_view --node-args="--env-file=.env"'
POST_BUILD="npm run db:migrate && npm run db:seed:admin"

# Usadas por promote.sh (botón de merge dev -> main en la UI).
GITHUB_REPO="Moibe/rad_view"
MERGE_HEAD="dev"
MERGE_BASE="main"
