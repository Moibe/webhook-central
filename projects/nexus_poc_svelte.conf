# Configuración de despliegue para nexus_poc_svelte (front de NexusDoc AI)
APP_STACK="svelte"
PROJECT_ROOT="/home/mbriseno/code/nexus_poc_svelte"
PROJECT_BRANCH="main"
PM2_NAME="nexus-front"

# SvelteKit + adapter-node (servidor real, no vite preview): el build expone
# build/index.js, que lee PORT/HOST/ORIGIN de process.env. Es adapter-node y no
# un build estático porque esta app proxea a nexus_back desde su capa server
# (patrón BFF): el navegador nunca llama a la API directo.
#
# OJO, mismo tropiezo ya documentado en shape_up.conf: adapter-node NO autocarga
# el .env (build/env.js solo lee process.env tal cual) — hay que pasarle el flag
# nativo de Node --node-args="--env-file=.env". Sin ese flag Node usa sus
# defaults (PORT=3000) EN SILENCIO, sin error: la app queda "online" en pm2 pero
# escuchando en el puerto equivocado.
#
# HOST=0.0.0.0 en el .env (no 127.0.0.1): este server no tiene nginx delante,
# las apps se exponen directo por IP:puerto como el resto de esta máquina.
#
# Puerto 3400: sigue la serie de las apps Node con adapter-node (shape_up = 3300).
# El rango 4173-4177 es de las apps Svelte que corren con `vite preview`, que son
# otra cosa.
#
# deploy.sh solo hace `pm2 restart` (que preserva el --node-args del pm2 start
# original), así que el primer arranque es manual, una sola vez:
#   cd /home/mbriseno/code/nexus_poc_svelte
#   # crear .env aquí (PORT=3400, HOST=0.0.0.0, ORIGIN, BODY_SIZE_LIMIT=25M)
#   npm ci && npm run build
#   pm2 start build/index.js --name nexus-front --cwd /home/mbriseno/code/nexus_poc_svelte --node-args="--env-file=.env"
#   pm2 save
# BODY_SIZE_LIMIT=25M en el .env NO es opcional: adapter-node topa el cuerpo de
# cada request en 512 KB por default, y el pipeline documental sube el archivo
# entero por POST. Sin esa línea, cualquier documento de más de 512 KB falla —
# una foto de INE pesa 1.5-3 MB. Y falla feo: Node aborta el stream antes de que
# corra el handler, así que el error que llega no habla de tamaño y manda a
# diagnosticar al lugar equivocado. Tampoco se reproduce en `npm run dev` (el
# dev server de Vite no aplica el tope), así que solo se ve ya desplegado.

PM2_START_CMD='pm2 start build/index.js --name nexus-front --cwd /home/mbriseno/code/nexus_poc_svelte --node-args="--env-file=.env"'
