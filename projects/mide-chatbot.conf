# Configuración de despliegue para mide-chatbot
PROJECT_ROOT="/home/mbriseno/code/mide-chatbot"
PROJECT_BRANCH="main"
VENV_PATH="$PROJECT_ROOT/venv"
PM2_NAME="mide-chatbot-api"

# Antes esta instancia desplegaba desde `dev`, o sea que cada push a dev caía
# directo en el servicio público. Desde 2026-09-23 sigue a `main`, y `dev` pasó
# a ser rama de desarrollo de verdad. Cuando prod se mude al servidor externo,
# esta instancia se voltea a PROJECT_BRANCH="dev" y queda como el ambiente dev
# (ya tiene venv, corpus y chroma armados — por eso no hay que construir nada).

# Usadas por promote.sh (botón de merge dev -> main en la UI, crea el PR en
# GitHub y lo mergea al instante, sin pausa de revisión).
GITHUB_REPO="Moibe/mide-chatbot"
MERGE_HEAD="dev"
MERGE_BASE="main"
