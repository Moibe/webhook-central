# Configuración de despliegue para nexus_monitor
APP_STACK="svelte"
PROJECT_ROOT="/home/mbriseno/code/nexus_monitor"
PROJECT_BRANCH="dev"
PM2_NAME="nexus-monitor"

# App nueva de CSI: arranca SOLO en DEV (rama dev, pestaña Dev de la UI), igual
# que constructor-agente-rag e inventario-ti. Todavía no tiene entorno de
# producción ni botón de promoción; cuando se decida pasarla a Prod se hace como
# con nexus_back/shape_up (env "prod" + merge_url + GITHUB_REPO/MERGE_HEAD/
# MERGE_BASE aquí, y un nexus_monitor_dev aparte en el puerto siguiente).

# Monitor de lo que Nexus tiene por fuera: hoy lista los procesadores (extractores)
# de Document AI y los cruza con su uso real en Cloud Monitoring. SvelteKit 5 +
# adapter-node. NO comparte base ni backend con nexus_back: habla directo con las
# APIs de Google con la MISMA service account que nexus_back.
#
# Mismo patrón que inventario-ti/shape_up: adapter-node NO autocarga el .env, por
# eso va --node-args="--env-file=.env". Esto está MEDIDO en este repo, no supuesto:
# `node build/index.js` sin --env-file ignora por completo el .env y la ruta
# responde 502 "Falta DOCAI_PROJECT_ID" aunque el archivo exista al lado.
#
# OJO con Node: este server corre v20.20.2 (igual que anota inventario-ti.conf).
# google-auth-library v11 y sus transitivas (gcp-metadata 9, google-logging-utils 2)
# piden Node >=22, así que el primer `npm ci` aquí murió con EBADENGINE el
# 2026-10-07. El repo quedó fijado en google-auth-library ^10.9.1 (pide >=18) y
# con `engines.node: ">=20.19"` en su package.json. Antes de subir cualquier
# dependencia nueva de este proyecto, revisar que no exija 22+.
PM2_START_CMD='pm2 start build/index.js --name nexus-monitor --cwd /home/mbriseno/code/nexus_monitor --node-args="--env-file=.env"'

# ── Qué va en el .env de ESTE checkout (a mano, git no lo trae) ──────────────
#
# PORT=3435
# HOST=0.0.0.0        ← sin nginx delante, como el resto de esta máquina.
# ORIGIN=http://172.10.30.15:3435   ← cadena EXACTA, con el puerto de esta app.
#
# DOCAI_PROJECT_ID    ← el MISMO valor que el .env de nexus_back en este server.
#   Sin él la app no truena al arrancar (a propósito): truena al primer request
#   con 502 "Falta DOCAI_PROJECT_ID". La comprobación va dentro del handler y no
#   a nivel de módulo porque a nivel de módulo ROMPE EL BUILD.
# DOCAI_LOCATION=us   ← se barrieron las 10 locations; las otras 9 dan cero.
#
# GOOGLE_APPLICATION_CREDENTIALS  ← ruta ABSOLUTA al JSON de la service account.
#   REUSA el mismo archivo que ya usa nexus_back en este server (el .env de
#   nexus_back dice cuál). NO generes una llave nueva: crear llaves está
#   bloqueado en ese proyecto (PERMISSION_DENIED, verificado 2026-08-17).
#
#   OJO con cómo falla: en la laptop, si esta variable falta, google-auth cae en
#   silencio a las credenciales de `gcloud` y la app RESPONDE 200 igual, con otra
#   identidad. Aquí no hay gcloud, así que falta = 502 "Falta
#   GOOGLE_APPLICATION_CREDENTIALS en el server". O sea: que funcione en la
#   laptop no prueba nada sobre este server.
#
# La SA necesita permiso de Document AI Y de Cloud Monitoring (la columna "Uso"
# consulta monitoring.googleapis.com). Si solo tuviera el de Document AI, la
# lista carga igual y el cruce de uso se degrada solo, con un aviso en pantalla.
#
# BODY_SIZE_LIMIT no hace falta: esta app no sube archivos, solo lee y (con
# confirmación escrita) borra.

# ── Advertencia de alcance ──────────────────────────────────────────────────
# Esta app PUEDE BORRAR procesadores de Document AI (botón de basura por fila,
# con modal que exige escribir el ID exacto). Borrar es irreversible y se lleva
# el dataset y el esquema del procesador. Expuesta en IP:puerto sin auth, queda
# al alcance de cualquiera en la red interna: si eso incomoda, lo correcto es
# quitar la ruta DELETE (src/routes/api/procesadores/[id]) antes que confiar en
# que nadie la encuentre.
