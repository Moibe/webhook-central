# Configuración de despliegue para shape_up (entorno dev)
# Hermano de shape_up.conf (prod): mismo repo, checkout y rama distintos.
APP_STACK="svelte"
PROJECT_ROOT="/home/mbriseno/code/shape_up-dev"
PROJECT_BRANCH="dev"
PM2_NAME="shape-up-dev"

# Mismo caso que prod: adapter-node necesita --env-file=.env explícito (ver
# shape_up.conf para el detalle del bug de puerto). Primer arranque manual,
# ya hecho el 2026-09-10:
#   cd /home/mbriseno/code/shape_up-dev
#   # .env propio (PORT=3301, HOST=0.0.0.0, ORIGIN, DATABASE_URL, PUBLIC_APP_TITLE)
#   npm run db:seed:admin
#   pm2 start build/index.js --name shape-up-dev --cwd /home/mbriseno/code/shape_up-dev --node-args="--env-file=.env"
#   pm2 save
PM2_START_CMD='pm2 start build/index.js --name shape-up-dev --cwd /home/mbriseno/code/shape_up-dev --node-args="--env-file=.env"'

# DATABASE_URL=./local.db es relativo al PROJECT_ROOT, así que dev y prod ya
# quedan aislados en su propio archivo SQLite sin configuración extra.
POST_BUILD="npm run db:migrate"
