# Configuración de despliegue para shape_up
APP_STACK="svelte"
PROJECT_ROOT="/home/mbriseno/code/shape_up"
PROJECT_BRANCH="main"
PM2_NAME="shape-up"

# shape_up es SvelteKit + adapter-node (servidor real, no vite preview): el build
# expone build/index.js, que lee PORT/HOST/ORIGIN/DATABASE_URL/etc. de un .env en
# PROJECT_ROOT. OJO: adapter-node NO autocarga dotenv (bug real encontrado
# 2026-07-21: el primer pm2 start sin --node-args arrancó con los defaults de Node
# — PORT=3000, HOST=0.0.0.0 — sin error visible; pm2 marcaba "online" pero servía
# en el puerto equivocado). Hay que pasarle el flag nativo de Node, igual que ya
# hace db:migrate en package.json. deploy.sh solo hace `pm2 restart`, así que el
# primer arranque es manual, una sola vez:
#   cd /home/mbriseno/code/shape_up
#   # crear .env aquí (PORT, HOST, ORIGIN, DATABASE_URL, PUBLIC_APP_TITLE)
#   npm run db:seed:admin   # crea admin/admin — sin esto nadie puede entrar
#   pm2 start build/index.js --name shape-up --node-args="--env-file=.env"
#   pm2 save
PM2_START_CMD='pm2 start build/index.js --name shape-up --cwd /home/mbriseno/code/shape_up --node-args="--env-file=.env"'

# deploy.sh no corre migraciones por sí solo; esta app SÍ las necesita (Drizzle).
POST_BUILD="npm run db:migrate"
