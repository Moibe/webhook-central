# Configuración de despliegue para shape_up
APP_STACK="svelte"
PROJECT_ROOT="/home/mbriseno/code/shape_up"
PROJECT_BRANCH="main"
PM2_NAME="shape-up"

# shape_up es SvelteKit + adapter-node (servidor real, no vite preview): el build
# expone build/index.js, que lee PORT/HOST/ORIGIN/DATABASE_URL/etc. de process.env.
# OJO: adapter-node NO autocarga el .env (build/env.js solo lee process.env tal
# cual) — hay que pasarle el flag nativo de Node --env-file=.env, igual que ya
# hace `db:migrate` en package.json. Sin ese flag, Node usa sus defaults
# (PORT=3000, HOST=0.0.0.0) en silencio, sin error (bug real, detectado 2026-07-21:
# la app corría "online" en pm2 pero en el puerto equivocado).
# HOST=0.0.0.0 en el .env (no 127.0.0.1): esta app no tiene nginx delante todavía,
# se expone directo por IP:puerto como el resto de las apps de este servidor.
# deploy.sh solo hace `pm2 restart` (que preserva --node-args del pm2 start
# original), así que el primer arranque es manual, una sola vez:
#   cd /home/mbriseno/code/shape_up
#   # crear .env aquí (PORT, HOST=0.0.0.0, ORIGIN, DATABASE_URL, PUBLIC_APP_TITLE)
#   npm run db:seed:admin   # crea admin/admin — sin esto nadie puede entrar
#   pm2 start build/index.js --name shape-up --cwd /home/mbriseno/code/shape_up --node-args="--env-file=.env"
#   pm2 save
PM2_START_CMD='pm2 start build/index.js --name shape-up --cwd /home/mbriseno/code/shape_up --node-args="--env-file=.env"'

# deploy.sh no corre migraciones por sí solo; esta app SÍ las necesita (Drizzle).
POST_BUILD="npm run db:migrate"
