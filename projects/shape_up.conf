# Configuración de despliegue para shape_up
APP_STACK="svelte"
PROJECT_ROOT="/home/mbriseno/code/shape_up"
PROJECT_BRANCH="main"
PM2_NAME="shape-up"

# shape_up es SvelteKit + adapter-node (servidor real, no vite preview): el build
# expone build/index.js, que lee PORT/HOST/ORIGIN/DATABASE_URL/etc. de un .env en
# PROJECT_ROOT (adapter-node autocarga dotenv). deploy.sh solo hace `pm2 restart`,
# así que el primer arranque es manual, una sola vez:
#   cd /home/mbriseno/code/shape_up
#   # crear .env aquí (PORT, HOST, ORIGIN, DATABASE_URL, ADMIN_PASSWORD, PUBLIC_APP_TITLE)
#   pm2 start build/index.js --name shape-up
#   pm2 save
PM2_START_CMD='pm2 start build/index.js --name shape-up --cwd /home/mbriseno/code/shape_up'

# deploy.sh no corre migraciones por sí solo; esta app SÍ las necesita (Drizzle).
POST_BUILD="npm run db:migrate"
