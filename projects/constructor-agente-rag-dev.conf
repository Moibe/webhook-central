# Configuración de despliegue para constructor-agente-rag (entorno dev)
PROJECT_ROOT="/home/mbriseno/code/constructor-agente-rag-dev"
PROJECT_BRANCH="dev"
VENV_PATH="$PROJECT_ROOT/venv"
PM2_NAME="constructor-agente-rag-dev"

# Primer arranque (manual, una sola vez; deploy.sh solo hace `pm2 restart`):
#   git clone -b dev <misma URL remota que el checkout de prod> /home/mbriseno/code/constructor-agente-rag-dev
#   cd /home/mbriseno/code/constructor-agente-rag-dev && python3 -m venv venv && venv/bin/pip install -r requirements.txt
#   .env propio: PORT=8078, rutas de datos PROPIAS (LOG_DB_PATH, AGENTES_DB_PATH, CHROMA_PATH,
#   TEMP_FOLDER, DOCS_FOLDER distintas a las de prod), FUENTES_CLAVE, CORS con 4178 y 4179.
#   app.py lee PORT del .env (load_dotenv), por eso el start no lleva --port.
PM2_START_CMD='pm2 start /home/mbriseno/code/constructor-agente-rag-dev/venv/bin/python --name constructor-agente-rag-dev --interpreter none --cwd /home/mbriseno/code/constructor-agente-rag-dev -- app.py'

# Usadas por refresh.sh (botón "Refrescar con datos de prod" de la UI): copia los
# datos de prod sobre los de dev. Cada ruta se resuelve como la lee la app, con
# la variable del .env de cada checkout o el default, relativa a su carpeta.
REFRESH_FROM="/home/mbriseno/code/constructor-agente-rag"
REFRESH_DATA="AGENTES_DB_PATH:agentes.db LOG_DB_PATH:logs.db CHROMA_PATH:chroma DOCS_FOLDER:./data/documentos"
