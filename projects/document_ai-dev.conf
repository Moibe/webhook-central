# Configuración de despliegue para document_ai (entorno dev)
PROJECT_ROOT="/home/mbriseno/code/document_ai-dev"
PROJECT_BRANCH="dev"
VENV_PATH="$PROJECT_ROOT/venv"
PM2_NAME="document-ai-api-dev"

# Primer arranque (manual, una sola vez; deploy.sh solo hace `pm2 restart`).
# Puerto 8102 va en los args de gunicorn (prod usa 8099). .env propio con su documentai_sa.json.
PM2_START_CMD='pm2 start /home/mbriseno/code/document_ai-dev/venv/bin/python --name document-ai-api-dev --interpreter none --cwd /home/mbriseno/code/document_ai-dev -- -m gunicorn app:app --workers 2 --worker-class uvicorn.workers.UvicornWorker --bind 0.0.0.0:8102'
