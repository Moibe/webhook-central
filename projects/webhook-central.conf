# Configuración de despliegue para webhook-central (el sistema de webhooks mismo)
APP_STACK="none"
PROJECT_ROOT="/home/mbriseno/webhook-central"
PROJECT_BRANCH="main"
PM2_NAME="webhook-listener"

# OJO — despliegue circular a propósito: este deploy hace `pm2 restart
# webhook-listener` desde un script que corre como hijo del propio proceso
# webhook-listener. Si PM2 mata el árbol de procesos al reiniciar, el script
# de deploy.sh puede cortarse a medias y no llegar a loguear el evento
# "finished" — el dashboard se queda mostrando "Desplegando..." para este
# proyecto hasta el siguiente deploy (que sí se autolimpia, el lock file se
# libera solo al detectar que el PID viejo ya no vive). Es cosmético, no
# rompe nada: git pull + pm2 restart ya se ejecutaron antes de que eso pase.
