# Configuración de despliegue para nexus_back (entorno staging)
# Hermano de nexus_back.conf (prod) y nexus_back_dev.conf: mismo repo, checkout y rama distintos.
APP_STACK="python"
PROJECT_ROOT="/home/mbriseno/code/nexus_back-staging"
PROJECT_BRANCH="staging"
VENV_PATH="$PROJECT_ROOT/venv"
PM2_NAME="nexus-back-api-staging"
PM2_START_CMD='pm2 start /home/mbriseno/code/nexus_back-staging/venv/bin/python --name nexus-back-api-staging --interpreter none --cwd /home/mbriseno/code/nexus_back-staging -- -m uvicorn app:app --host 0.0.0.0 --port 8085'

# Botón de promoción de la fila staging: dev -> staging (PR + merge inmediato).
GITHUB_REPO="Moibe/nexus_back"
MERGE_HEAD="dev"
MERGE_BASE="staging"

# ── Qué va en el .env de ESTE checkout (a mano, git no lo trae) ──────────────
# PORT=8085, ENVIRONMENT=staging, NEXUS_API_URL=http://127.0.0.1:8085
# FRONT_URL=<url del front staging>  (hoy http://172.10.30.15:3402)
# ENTREGAS_WEBHOOKS=off  ← se puso porque staging compartía base y almacén con prod:
#   evita que staging dispare entregas reales a webhooks de clientes. Desde el
#   2026-10-28 ya no comparte ninguno de los dos (ver abajo); se deja en off hasta
#   que se decida revisarlo.
# SQLSERVER_*: base PROPIA, `IA_Nexus_Staging` (verificado en /health/db).
# ALMACEN_RUTA=/mnt/nexus/documentos-staging  ← PROPIO desde el 2026-10-28. Carpeta
#   hermana de la de prod dentro del mismo NAS, con su propio centinela
#   (`touch /mnt/nexus/documentos-staging/.nexus-almacen`). Antes apuntaba al
#   almacén de PRODUCCIÓN, y como usuarios, organizaciones y llaves viven ahí
#   (`.registro/*.jsonl`), los tres ambientes compartían los mismos superadmins:
#   crear o retirar uno en staging lo hacía también en producción. Hoy arranca
#   vacío; el primer superadmin se da de alta desde la pestaña Staging de
#   Nexus Monitor.
# WEBHOOKS_CLAVE_CIFRADO: la MISMA que prod (si no, no descifra lo ya guardado).
# AUTH_JWT_SECRET y NEXUS_API_KEY: propias de staging, iguales a las del front staging.
