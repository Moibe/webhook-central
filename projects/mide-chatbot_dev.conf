# Configuración de despliegue para mide-chatbot (entorno dev)
# Hermano de mide-chatbot.conf (prod, rama main, :8080): mismo repo, checkout y rama distintos.
PROJECT_ROOT="/home/mbriseno/code/mide-chatbot-dev"
PROJECT_BRANCH="dev"
VENV_PATH="$PROJECT_ROOT/venv"
PM2_NAME="mide-chatbot-api-dev"

# deploy.sh solo hace `pm2 restart`, así que el primer arranque es manual, una sola vez.
# La app guarda sus datos dentro de su carpeta (chroma/, vector_db/, logs.db): dev
# necesita su propia copia para no escribir sobre los de prod.
#   cd /home/mbriseno/code
#   git clone -b dev https://github.com/Moibe/mide-chatbot mide-chatbot-dev
#   cd mide-chatbot-dev
#   python3 -m venv venv && venv/bin/pip install -r requirements.txt
#   cp ../mide-chatbot/.env .              # y revisar si algo debe cambiar para dev
#   cp -r ../mide-chatbot/chroma ../mide-chatbot/vector_db .
#   pm2 start "venv/bin/uvicorn app:app --host 0.0.0.0 --port 8081" --name mide-chatbot-api-dev --cwd /home/mbriseno/code/mide-chatbot-dev
#   pm2 save
# Antes de arrancar conviene ver cómo corre prod (`pm2 describe mide-chatbot-api`) y copiar su forma.
PM2_START_CMD='pm2 start "venv/bin/uvicorn app:app --host 0.0.0.0 --port 8081" --name mide-chatbot-api-dev --cwd /home/mbriseno/code/mide-chatbot-dev'
