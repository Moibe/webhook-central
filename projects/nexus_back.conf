APP_STACK="python"
PROJECT_ROOT="/home/mbriseno/code/nexus_back"
PROJECT_BRANCH="main"
VENV_PATH="$PROJECT_ROOT/venv"
PM2_NAME="nexus-back-api"
PM2_START_CMD='pm2 start /home/mbriseno/code/nexus_back/venv/bin/python --name nexus-back-api --interpreter none --cwd /home/mbriseno/code/nexus_back -- -m uvicorn app:app --host 0.0.0.0 --port 8083'

# Migraciones de base: tras el pull/pip y antes del restart. Si falla, deploy.sh
# aborta (post_build) y la app vieja sigue corriendo. --esperar-env protege contra
# un .conf copiado a otro entorno: se niega si el SQLSERVER_DB del .env no coincide.
# Produccion pide ademas --produccion, y el corredor solo deja entrar una migracion
# si ya esta aplicada en staging con la misma suma de comprobacion.
# Ojo: main todavia NO trae la carpeta migraciones/ (2026-10-28). Funciona porque el
# deploy hace el pull ANTES del POST_BUILD, asi que el primer deploy de prod que
# baje la promocion desde staging ya la trae. Un deploy de prod con commits SIN esa
# carpeta fallaria con "No module named migraciones" (sin reiniciar: la app sigue).
# La linea base 0001 ya esta marcada en IA_Nexus.
POST_BUILD="venv/bin/python -m migraciones aplicar --base IA_Nexus --confirmar --produccion --esperar-env .env"

# Usadas por promote.sh (botón de merge dev -> main en la UI, crea el PR en
# GitHub y lo mergea al instante, sin pausa de revisión).
GITHUB_REPO="Moibe/nexus_back"
MERGE_HEAD="staging"
MERGE_BASE="main"
